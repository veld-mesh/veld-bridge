[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veldbridge"
version = "0.1.0"
description = "veld-bridge Meshtastic <-> WhatsApp bridge core"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The real mesh adapter. Kept optional so CI and tests never need it.
mesh = ["meshtastic>=2.7.11,<2.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
veldbridge = "veldbridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veldbridge = ["schema.sql", "admin.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
